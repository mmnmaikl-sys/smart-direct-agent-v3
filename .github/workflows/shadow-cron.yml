name: Shadow-period cron triggers

# Free GitHub-hosted cron — pings the deployed /run/{job} endpoints during the
# 14-day shadow validation. Railway's [[cron]] in railway.toml requires per-job
# service creation (UI-only), which is overkill while jobs run in shadow
# (no mutations possible). Once we promote to ASSISTED, switch to Railway
# native cron services so each job has independent retry/observability.

on:
  schedule:
    # shadow_monitor: every 5 min (invariant guard — critical)
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping-shadow-critical:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: shadow_monitor (every 5 min)
        env:
          BEARER: ${{ secrets.SDA_INTERNAL_API_KEY }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $BEARER" \
            --max-time 60 \
            "https://smart-direct-agent-v3-production.up.railway.app/run/shadow_monitor?dry_run=false" \
            | python3 -c "import sys,json; r=json.load(sys.stdin); print('shadow_monitor:', r.get('result',{}).get('locked'),  r.get('result',{}).get('violations_count'))"

      - name: watchdog (only at :00 of each hour — co-trigger via 12-of-60 mod check)
        env:
          BEARER: ${{ secrets.SDA_INTERNAL_API_KEY }}
        run: |
          MIN=$(date -u +%M)
          if [ "$MIN" = "00" ]; then
            curl -fsS -X POST -H "Authorization: Bearer $BEARER" \
              --max-time 60 \
              "https://smart-direct-agent-v3-production.up.railway.app/run/watchdog?dry_run=false" \
              | python3 -c "import sys,json; r=json.load(sys.stdin); print('watchdog:', r.get('result',{}).get('status'), r.get('result',{}).get('stale_services'))"
          else
            echo "watchdog: skipped (minute=$MIN, runs only :00)"
          fi

      - name: strategic_advisor (every 4 hours at :00 — minute=00 + hour mod 4)
        env:
          BEARER: ${{ secrets.SDA_INTERNAL_API_KEY }}
        run: |
          MIN=$(date -u +%M)
          HOUR=$(date -u +%H)
          if [ "$MIN" = "00" ] && [ $((10#$HOUR % 4)) -eq 0 ]; then
            curl -fsS -X POST -H "Authorization: Bearer $BEARER" \
              --max-time 180 \
              "https://smart-direct-agent-v3-production.up.railway.app/run/strategic_advisor?dry_run=false" \
              | python3 -c "import sys,json; r=json.load(sys.stdin); print('strategic_advisor:', r.get('result',{}).get('status'), 'advice_chars=', r.get('result',{}).get('advice_chars'))"
          else
            echo "strategic_advisor: skipped (hour=$HOUR min=$MIN, runs only at :00 every 4h)"
          fi

      - name: ad_rewriter (weekly Mon at 13:30 UTC — 16:30 МСК — Sonnet rewrite top-3)
        env:
          BEARER: ${{ secrets.SDA_INTERNAL_API_KEY }}
        run: |
          MIN=$(date -u +%M)
          HOUR=$(date -u +%H)
          DOW=$(date -u +%u)
          if [ "$DOW" = "1" ] && [ "$HOUR" = "13" ] && [ "$MIN" = "30" ]; then
            curl -fsS --max-time 120 -X POST -H "Authorization: Bearer $BEARER" \
              "https://smart-direct-agent-v3-production.up.railway.app/run/ad_rewriter?dry_run=false" \
              | python3 -c "import sys,json; r=json.load(sys.stdin); print('ad_rewriter:', r.get('result',{}))"
          else
            echo "ad_rewriter: skipped (DOW=$DOW hour=$HOUR min=$MIN, runs Mon 13:30 UTC)"
          fi

      - name: landing_critic (weekly Mon at 13:00 UTC — 16:00 МСК)
        env:
          BEARER: ${{ secrets.SDA_INTERNAL_API_KEY }}
        run: |
          MIN=$(date -u +%M)
          HOUR=$(date -u +%H)
          DOW=$(date -u +%u)
          if [ "$DOW" = "1" ] && [ "$HOUR" = "13" ] && [ "$MIN" = "00" ]; then
            curl -fsS --max-time 60 -X POST -H "Authorization: Bearer $BEARER" \
              "https://smart-direct-agent-v3-production.up.railway.app/run/landing_critic?dry_run=false" \
              | python3 -c "import sys,json; r=json.load(sys.stdin); print('landing_critic:', r.get('result',{}).get('verdicts'))"
          else
            echo "landing_critic: skipped (DOW=$DOW hour=$HOUR min=$MIN, runs Mon 13:00 UTC)"
          fi

      - name: main_campaigns_watchdog (DISABLED 26.04.2026 — owner suspended ЕПК campaigns)
        run: |
          echo "main_watchdog: permanently disabled (owner decision 26.04.2026, Variant 1)."
          echo "Whitelist in agent_runtime/jobs/main_campaigns_watchdog.py is empty."
          echo "Re-enable: restore _MAIN_CAMPAIGNS dict + cron step. Requires owner approval."

      - name: funnel_cr_tracker (daily at 14:30 UTC — 17:30 МСК, real Bitrix funnel)
        env:
          BEARER: ${{ secrets.SDA_INTERNAL_API_KEY }}
        run: |
          MIN=$(date -u +%M)
          HOUR=$(date -u +%H)
          if [ "$MIN" = "30" ] && [ "$HOUR" = "14" ]; then
            curl -fsS --max-time 60 -X POST -H "Authorization: Bearer $BEARER" \
              "https://smart-direct-agent-v3-production.up.railway.app/run/funnel_cr_tracker?dry_run=false" \
              | python3 -c "import sys,json; r=json.load(sys.stdin); print('funnel_cr:', r.get('result',{}))"
          else
            echo "funnel_cr: skipped (hour=$HOUR min=$MIN, runs daily 14:30 UTC)"
          fi

      - name: metrika_health_check (daily at 13:30 UTC — 16:30 МСК, broken-tracking alert)
        env:
          BEARER: ${{ secrets.SDA_INTERNAL_API_KEY }}
        run: |
          MIN=$(date -u +%M)
          HOUR=$(date -u +%H)
          if [ "$MIN" = "30" ] && [ "$HOUR" = "13" ]; then
            curl -fsS --max-time 60 -X POST -H "Authorization: Bearer $BEARER" \
              "https://smart-direct-agent-v3-production.up.railway.app/run/metrika_health_check?dry_run=false" \
              | python3 -c "import sys,json; r=json.load(sys.stdin); print('metrika_health:', r.get('result',{}))"
          else
            echo "metrika_health: skipped (hour=$HOUR min=$MIN, runs daily 13:30 UTC)"
          fi

      - name: ad_quality_assessor (daily at 12:10 UTC — 15:10 МСК, ФЗ-38 + quality)
        env:
          BEARER: ${{ secrets.SDA_INTERNAL_API_KEY }}
        run: |
          MIN=$(date -u +%M)
          HOUR=$(date -u +%H)
          if [ "$MIN" = "10" ] && [ "$HOUR" = "12" ]; then
            curl -fsS --max-time 60 -X POST -H "Authorization: Bearer $BEARER" \
              "https://smart-direct-agent-v3-production.up.railway.app/run/ad_quality_assessor?dry_run=false" \
              | python3 -c "import sys,json; r=json.load(sys.stdin); print('ad_quality:', r.get('result',{}).get('verdicts'))"
          else
            echo "ad_quality: skipped (hour=$HOUR min=$MIN, runs daily 12:10 UTC)"
          fi

      - name: tactical_actuator (every 4h at :05 — first autonomous DailyBudget actuator)
        env:
          BEARER: ${{ secrets.SDA_INTERNAL_API_KEY }}
        run: |
          MIN=$(date -u +%M)
          HOUR=$(date -u +%H)
          if [ "$MIN" = "05" ] && [ $((10#$HOUR % 4)) -eq 0 ]; then
            curl -fsS -X POST -H "Authorization: Bearer $BEARER" \
              --max-time 60 \
              "https://smart-direct-agent-v3-production.up.railway.app/run/tactical_actuator?dry_run=false" \
              | python3 -c "import sys,json; r=json.load(sys.stdin); print('tactical_actuator:', r.get('result',{}).get('status'), 'applied=', r.get('result',{}).get('applied'), '/', r.get('result',{}).get('actionable'))"
          else
            echo "tactical_actuator: skipped (hour=$HOUR min=$MIN, runs only at :05 every 4h)"
          fi
